<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG Adventure</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🌍 RPG Adventure</h1>

<div class="map">
  <button onclick="startBattle('forest')">🌲 Forest</button>
  <button onclick="startBattle('cave')">🕳️ Cave</button>
  <button onclick="startBattle('castle')">🏰 Castle</button>
</div>

<!-- PLAYER & ENEMY -->
<div class="battle">

  <div class="character">
    <img src="https://i.imgur.com/8Qf4Q0G.png">
    <p>🧙 Player</p>
    <p id="hp"></p>
  </div>

  <div class="character">
    <img id="enemyImg" src="">
    <p>👾 Enemy</p>
    <p id="enemyHp"></p>
  </div>

</div>

<h2 id="story">Klik area untuk mulai</h2>

<div class="actions">
  <button onclick="attack()">⚔️ Attack</button>
  <button onclick="heal()">❤️ Heal</button>
  <button onclick="run()">🏃 Run</button>
</div>

<script src="game.js"></script>

</body>
</html>
