<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RPG Story Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginBox" class="card">
  <h2>Login / Register</h2>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<div id="game" style="display:none">

<h1>🌍 RPG Adventure</h1>

<div class="map">
  <button onclick="goArea('forest')">🌲 Forest</button>
  <button onclick="goArea('cave')">🕳️ Cave</button>
  <button onclick="goArea('castle')">🏰 Castle</button>
</div>

<div class="ui">
  <p>👤 <span id="playerName"></span></p>
  <p>❤️ HP: <span id="hp"></span></p>
  <p>⭐ EXP: <span id="exp"></span></p>
</div>

<h2 id="story">Pilih area untuk memulai petualangan</h2>
<div id="answers"></div>

</div>

<script src="game.js"></script>
</body>
</html>
